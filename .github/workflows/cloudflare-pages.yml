# Primary PWA pipeline: build on GitHub Actions, deploy static dist + Pages Functions to Cloudflare Pages.
#
# Secrets (repo → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   VITE_ABLY_KEY (optional local fallback baked into client)
#   VITE_ABLY_AUTH_URL (optional; set to /api/ably-token for token auth builds)
#
# Cloudflare Pages project secrets: ABLY_API_KEY, STAFF_PASSWORD, optional TEAMS_WEBHOOK_URL
# Optional KV binding: PEERPOINT_KV

name: Deploy PWA to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/pwa/**'
      - '.github/workflows/cloudflare-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pwa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/pwa/package-lock.json

      - name: Build PWA
        env:
          VITE_ABLY_KEY: ${{ secrets.VITE_ABLY_KEY }}
          VITE_ABLY_AUTH_URL: ${{ secrets.VITE_ABLY_AUTH_URL }}
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/pwa
          command: pages deploy dist --project-name=peer-support-pwa
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
